<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <script>
      (function () {
        try {
          var q = new URLSearchParams(location.search).get("brand");
          var stored = localStorage.getItem("portal-brand");
          var brand = q === "iris" || q === "lucas" ? q : stored;
          if (brand === "iris" || brand === "lucas") {
            document.documentElement.dataset.brand = brand;
          }
        } catch (e) {}
      })();
    </script>
    <title>Distributor Portal</title>
    <meta name="description" content="The IRIS Networks distributor portal for orders, invoices, product resources, and account support." />
    <meta name="robots" content="noindex, nofollow" />
    <style>html, body { height: 100%; margin: 0; } #root { height: 100%; }</style>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
